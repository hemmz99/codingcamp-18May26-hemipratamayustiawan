<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A personal productivity dashboard with time tracking, task management, focus timer, and quick links">
  <title>Life Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Theme Toggle Button -->
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
    <span class="sun-icon">☀️</span>
    <span class="moon-icon">🌙</span>
  </button>
  
  <div class="dashboard" role="main">
    <!-- Greeting Section -->
    <section class="greeting-section" aria-label="Greeting and current time">
      <div id="time-display" aria-live="polite" aria-atomic="true"></div>
      <div id="date-display"></div>
      <div id="greeting" role="heading" aria-level="1"></div>
      <div class="name-input-container">
        <input type="text" id="name-input" placeholder="Enter your name" maxlength="50" aria-label="Your name">
        <button id="save-name-btn" aria-label="Save name">Save</button>
      </div>
    </section>
    
    <!-- Focus Timer Section -->
    <section class="timer-section" aria-label="Focus timer">
      <h2>Focus Timer</h2>
      <div id="timer-display" aria-live="polite" aria-atomic="true" role="timer">
        <span id="timer-minutes-display">25</span>
        <span class="timer-separator">:</span>
        <span id="timer-seconds">00</span>
      </div>
      <div class="timer-controls" role="group" aria-label="Timer controls">
        <button id="timer-start" aria-label="Start focus timer">Start</button>
        <button id="timer-stop" aria-label="Stop focus timer">Stop</button>
        <button id="timer-reset" aria-label="Reset focus timer">Reset</button>
      </div>
      <div class="timer-set-controls" role="group" aria-label="Set timer duration">
        <label for="timer-input-minutes">Min</label>
        <input type="number" id="timer-input-minutes" min="0" max="999" value="25" aria-label="Set minutes">
        <label for="timer-input-seconds">Sec</label>
        <input type="number" id="timer-input-seconds" min="0" max="59" value="0" aria-label="Set seconds">
        <button id="timer-set" aria-label="Apply timer duration">Set Waktu</button>
      </div>
    </section>
    
    <!-- Task List Section -->
    <section class="tasks-section" aria-label="Task management">
      <h2>Tasks</h2>
      <div class="task-input" role="group" aria-label="Add new task">
        <input type="text" id="task-input" placeholder="Add a new task..." maxlength="500" aria-label="Task description">
        <button id="task-add" aria-label="Add task">Add</button>
      </div>
      <div class="task-toolbar">
        <label for="task-sort" class="sort-label">Sort:</label>
        <select id="task-sort" aria-label="Sort tasks">
          <option value="default">Default</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
        </select>
      </div>
      <div id="task-list" role="list" aria-label="Task list"></div>
    </section>
    
    <!-- Quick Links Section -->
    <section class="links-section" aria-label="Quick links">
      <h2>Quick Links</h2>
      <div class="link-input" role="group" aria-label="Add new quick link">
        <input type="text" id="link-name" placeholder="Name" aria-label="Link name" maxlength="100">
        <input type="text" id="link-url" placeholder="URL" aria-label="Link URL" maxlength="2048">
        <button id="link-add" aria-label="Add quick link">Add Link</button>
      </div>
      <div id="link-list" role="list" aria-label="Quick links list"></div>
    </section>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/app.js"></script>
</body>
</html>
